[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ulsim"
version = "0.1.0"
description = "Secure remote Debian installation and lightweight server management"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = ["paramiko>=3.4,<5", "zeroconf>=0.132,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.11,<1"]

[project.scripts]
ulsim = "ulsim.cli:main"

[tool.setuptools.packages.find]
include = ["ulsim*"]

[tool.setuptools.package-data]
ulsim = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["vm: requires a built image and QEMU; explicitly invoked"]

[tool.ruff]
target-version = "py311"
line-length = 110
