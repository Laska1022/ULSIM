name: Controller and safety tests
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest tests --ignore=tests/vm -v --junitxml=test-results.xml
      - run: ulsim --help
      - name: Check Python compilation
        run: python -m compileall -q ulsim boot/scripts
      - name: Install and run the Windows controller through PowerShell
        if: matrix.os == 'windows-latest' && matrix.python == '3.13'
        shell: powershell
        env:
          PY_PYTHON3: '3.13'
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\install-windows.ps1
          $InstalledPython = Join-Path $env:LOCALAPPDATA 'ULSIM\venv\Scripts\python.exe'
          $InstalledCli = Join-Path $env:LOCALAPPDATA 'ULSIM\venv\Scripts\ulsim.exe'
          if (-not (Test-Path $InstalledCli)) { throw 'The installer did not create the Windows CLI.' }
          Push-Location $env:RUNNER_TEMP
          try {
              & $InstalledPython -I -c "import pathlib, sys, ulsim; assert sys.version_info[:2] == (3, 13); assert pathlib.Path(ulsim.__file__).resolve().is_relative_to(pathlib.Path(sys.prefix).resolve())"
              if ($LASTEXITCODE -ne 0) { throw 'ULSIM was not imported from the installed Windows virtual environment.' }
              & $InstalledCli --version
              if ($LASTEXITCODE -ne 0) { throw 'The installed Windows CLI version check failed.' }
              & $InstalledCli --help
              if ($LASTEXITCODE -ne 0) { throw 'The installed Windows CLI help check failed.' }
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'Windows PowerShell installer and installed controller smoke checks passed.'
          } finally {
              Pop-Location
          }
      - name: Summarize test results
        if: always()
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path('test-results.xml')
          lines = ['## Controller and safety test results', '']
          if report.exists():
              cases = list(ET.parse(report).getroot().iter('testcase'))
              failures = [(case, issue) for case in cases for issue in case
                          if issue.tag in ('failure', 'error')]
              skipped = sum(case.find('skipped') is not None for case in cases)
              lines.append(f'{len(cases)} test cases; {len(failures)} failures/errors; {skipped} skipped.')
              for case, issue in failures[:20]:
                  name = case.get('classname', '') + '.' + case.get('name', '')
                  detail = (issue.text or issue.get('message', ''))[-5000:]
                  lines.extend(['', '### ' + name, '', '    ' + detail.replace('\n', '\n    ')])
          else:
              lines.append('Pytest did not produce a report. Inspect dependency installation and job logs.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n'.join(lines) + '\n')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controller-tests-${{ matrix.os }}-python-${{ matrix.python }}
          path: test-results.xml
          if-no-files-found: warn
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: find boot -type f \( -name '*.sh' -o -name '*.hook.chroot' \) -print0 | xargs -0 -r -n1 bash -n
