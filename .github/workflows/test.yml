name: Controller and safety tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest tests --ignore=tests/vm -v
      - run: ulsim --help
      - name: Check Python compilation
        run: python -m compileall -q ulsim boot/scripts
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: find boot -type f \( -name '*.sh' -o -name '*.hook.chroot' \) -print0 | xargs -0 -r -n1 bash -n
